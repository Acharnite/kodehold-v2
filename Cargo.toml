[package]
name = "kodehold"
version = "2.0.0"
edition = "2021"
description = "KodeHold v2.0 — code specification and generation tool"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
semver = "1"
git2 = "0.19"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
notify = "7"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[test]]
name = "integration"
harness = true
