version: 2
updates:
  # GitHub Actions — version + security updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # npm dependencies in .opencode/ (OpenCode plugin)
  - package-ecosystem: "npm"
    directory: "/.opencode"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
