name: KodeHold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: python3 -m pytest tests/ -v --cov=scripts --cov=tests --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate YAML files
        run: |
          pip install yamllint 2>/dev/null
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .github/ config/ || true
      - name: Python lint
        run: |
          pip install ruff 2>/dev/null
          ruff check scripts/ tests/


