name: KodeHold CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: "${{ matrix.os }} — build & test"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: kodehold
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: kodehold.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Configure git (required by integration tests)
        run: |
          git config --global user.name "KodeHold CI"
          git config --global user.email "ci@kodehold.dev"

      - name: cargo build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodehold-${{ matrix.os }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          compression-level: 0

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v8

      - name: Create release archive (Linux)
        run: |
          cp kodehold-ubuntu-latest/kodehold kodehold-x86_64-linux
          chmod +x kodehold-x86_64-linux

      - name: Create release archive (Windows)
        run: |
          cp kodehold-windows-latest/kodehold.exe kodehold-x86_64-windows.exe

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # strip leading v
          {
            echo 'notes<<EOF'
            echo "## KodeHold ${{ github.ref_name }}"
            echo ""
            if [ -f CHANGES.md ]; then
              grep -A 100 "^## $VERSION" CHANGES.md \
                | sed "/^## /{ /^## $VERSION/!q }" \
                || echo "See CHANGES.md for details."
            else
              echo "See CHANGES.md for details."
            fi
            echo ""
            echo "### Downloads"
            echo "- [kodehold-x86_64-linux](./kodehold-x86_64-linux) — Linux binary"
            echo "- [kodehold-x86_64-windows.exe](./kodehold-x86_64-windows.exe) — Windows binary"
            echo ""
            echo "### Checksums"
            sha256sum kodehold-x86_64-linux kodehold-x86_64-windows.exe
            EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KodeHold ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            kodehold-x86_64-linux
            kodehold-x86_64-windows.exe
          draft: false
          prerelease: false


