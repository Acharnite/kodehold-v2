# tasks.yaml — KodeHold Task and Workflow Configuration
# Version: 1.0

workflows:
  - id: implement-flow
    name: "Standard Implementation Flow"
    description: "Feature implementation from design through testing"
    steps:
      - id: design
        team: architects
        description: "Create/update design doc and ADRs"
        depends_on: []
        optional: false
      - id: design-review
        team: reviewers
        gate: design_review
        description: "Review design quality"
        depends_on: [design]
        optional: true
      - id: implement
        team: engineers
        description: "Implement per design doc specification"
        depends_on: [design-review]
        optional: false
      - id: code-review
        team: reviewers
        gate: code_review
        description: "Review implementation against design"
        depends_on: [implement]
        optional: false
      - id: test
        team: testers
        gate: tests_pass
        description: "Write and execute tests"
        depends_on: [implement]
        optional: false
      - id: comprehensive-review
        team: reviewers
        gate: comprehensive_review
        description: "Final review before state transition"
        depends_on: [code-review, test]
        optional: false

  - id: adr-flow
    name: "ADR Creation Flow"
    description: "Create and validate an Architecture Decision Record"
    steps:
      - id: research
        team: architects
        description: "Research and gather context for the ADR"
        depends_on: []
        optional: false
      - id: write-adr
        team: architects
        description: "Author ADR following Nygard format"
        depends_on: [research]
        optional: false
      - id: design-doc-update
        team: scribes
        description: "Update design doc to reflect ADR content"
        depends_on: [write-adr]
        optional: false
      - id: review-adr
        team: reviewers
        description: "Review ADR for completeness and consistency"
        depends_on: [write-adr]
        optional: false
      - id: cross-validate
        team: second-opinion
        description: "Cross-model validation of ADR"
        depends_on: [write-adr]
        optional: true
      - id: finalize
        team: scribes
        description: "Finalize ADR and design doc updates"
        depends_on: [review-adr, cross-validate]
        optional: false

  - id: bugfix-flow
    name: "Bug Fix Flow"
    description: "Triage, fix, and verify a bug"
    steps:
      - id: triage
        team: fls
        description: "Determine if minor (hotfix) or major (REOPEN + implement-flow)"
        depends_on: []
        optional: false
      - id: hotfix
        team: fls
        description: "Apply hotfix for minor severity bugs (minor path)"
        depends_on: [triage]
        optional: false
      - id: document
        team: scribes
        description: "Document the bug fix (minor path)"
        depends_on: [hotfix]
        optional: false
      - id: verify
        team: reviewers
        description: "Verify the fix works (minor path)"
        depends_on: [hotfix]
        optional: false
      - id: reopen-and-implement
        team: director
        description: "REOPEN state transition + trigger implement-flow (major path)"
        depends_on: [triage]
        optional: false

  - id: ship-gate
    name: "Shipping Gate"
    description: "Pre-release verification and release steps"
    steps:
      - id: version-check
        team: director
        description: "Verify VERSION.md exists and parses correctly"
        depends_on: []
        optional: false
      - id: changelog-check
        team: director
        description: "Verify CHANGES.md has an entry for this version"
        depends_on: []
        optional: false
      - id: todo-check
        team: director
        description: "Verify TODO.md exists and is current"
        depends_on: []
        optional: false
      - id: test-suite
        team: testers
        description: "Run full test suite and verify all pass"
        depends_on: []
        optional: false
      - id: git-status
        team: director
        description: "Verify git is clean and changes are staged"
        depends_on: []
        optional: false
      - id: branch-check
        team: director
        description: "Verify correct branch for release"
        depends_on: []
        optional: false

  - id: github-pr-flow
    name: "GitHub PR Creation and Merge Flow"
    description: "Create a feature branch, push changes, open PR, get reviewed, and merge"
    steps:
      - id: create-branch
        team: engineers
        description: "Create feature branch from base via github_create_branch"
        depends_on: []
        optional: false
      - id: push-commits
        team: engineers
        description: "Push all commits to feature branch with structured commit messages"
        depends_on: [create-branch]
        optional: false
      - id: create-pr
        team: engineers
        description: "Open PR with title describing change and body summarizing what/why"
        depends_on: [push-commits]
        optional: false
      - id: request-copilot-review
        team: reviewers
        description: "Request Copilot AI review via github_request_copilot_review"
        depends_on: [create-pr]
        optional: true
      - id: address-feedback
        team: engineers
        description: "Address review comments from any source, push additional commits"
        depends_on: [create-pr]
        optional: true
      - id: update-branch
        team: engineers
        description: "Sync feature branch with base if base has diverged"
        depends_on: [address-feedback]
        optional: true
      - id: merge-pr
        team: reviewers
        description: "Merge PR via github_merge_pull_request (squash by default)"
        depends_on: [create-pr, update-branch]
        optional: false
      - id: cleanup
        team: scribes
        description: "Delete feature branch, update CHANGES/TODO/VERSION, store PR summary"
        depends_on: [merge-pr]
        optional: false

gates:
  - id: design_review
    marker: .design_reviewed
    description: "Design quality approved by Reviewers"
    checks:
      - design_doc_sections_complete
      - adrs_written
      - second_opinion_obtained

  - id: code_review
    marker: .code_reviewed
    description: "Code reviewed against design doc"
    checks:
      - matches_design_spec
      - no_security_issues
      - follows_conventions

  - id: tests_pass
    marker: .testers_done
    description: "Tests written and passing"
    checks:
      - unit_tests_pass
      - integration_tests_pass
      - no_regressions

  - id: comprehensive_review
    marker: .testers_done
    description: "Final gate before ACTIVE -> REVIEW"
    checks:
      - all_gates_pass
      - design_doc_current

  - id: impact_analysis
    marker: .impact_analysis_done
    description: "Architects completed impact assessment"
    checks:
      - design_doc_updated
      - adrs_written
